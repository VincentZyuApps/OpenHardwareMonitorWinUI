<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Open Hardware Monitor WinUI</title>
  <desc id="desc">A Fluent desktop monitor containing a cooling fan, processor and performance graph.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dce1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30343a"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60cdff"/>
      <stop offset="0.52" stop-color="#168cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9bec7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <path id="blade" d="M365 430c-13-52 3-98 43-119 27-14 50-4 52 18 4 42-31 79-95 101z"/>
  </defs>

  <g filter="url(#shadow)">
    <path d="M432 785h160l19 92h54c20 0 36 16 36 36v7H323v-7c0-20 16-36 36-36h54z" fill="url(#frame)" stroke="#25282d" stroke-width="22" stroke-linejoin="round"/>
    <rect x="104" y="116" width="816" height="684" rx="82" fill="url(#frame)" stroke="#25282d" stroke-width="24"/>
    <rect x="145" y="157" width="734" height="560" rx="48" fill="url(#screen)" stroke="#555b64" stroke-width="14"/>
    <path d="M184 194h656" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g aria-label="cooling fan">
    <circle cx="365" cy="430" r="172" fill="#111316" stroke="#666c75" stroke-width="18"/>
    <circle cx="365" cy="430" r="148" fill="#22262b" stroke="#090a0c" stroke-width="10"/>
    <g fill="url(#accent)">
      <use href="#blade"/>
      <use href="#blade" transform="rotate(72 365 430)"/>
      <use href="#blade" transform="rotate(144 365 430)"/>
      <use href="#blade" transform="rotate(216 365 430)"/>
      <use href="#blade" transform="rotate(288 365 430)"/>
    </g>
    <circle cx="365" cy="430" r="52" fill="url(#chip)" stroke="#202327" stroke-width="17"/>
    <circle cx="365" cy="430" r="19" fill="#ffffff" fill-opacity="0.65"/>
    <g fill="#aeb4bd" stroke="#181a1d" stroke-width="8">
      <circle cx="239" cy="304" r="17"/><circle cx="491" cy="304" r="17"/>
      <circle cx="239" cy="556" r="17"/><circle cx="491" cy="556" r="17"/>
    </g>
  </g>

  <g aria-label="processor">
    <g stroke-linecap="round" stroke-width="16">
      <path d="M614 253v-35m52 35v-35m52 35v-35M614 435v35m52-35v35m52-35v35" stroke="url(#accent)"/>
      <path d="M575 292h-35m35 52h-35m35 52h-35M757 292h35m-35 52h35m-35 52h35" stroke="#dfe3e8"/>
    </g>
    <rect x="574" y="252" width="184" height="184" rx="38" fill="#25282d" stroke="#0e1012" stroke-width="15"/>
    <rect x="612" y="290" width="108" height="108" rx="24" fill="url(#chip)" stroke="#626872" stroke-width="12"/>
    <path d="M632 314h68" stroke="#ffffff" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g aria-label="performance graph">
    <rect x="584" y="614" width="67" height="64" rx="17" fill="#38bdf8"/>
    <rect x="676" y="568" width="67" height="110" rx="17" fill="#168cff"/>
    <rect x="768" y="514" width="67" height="164" rx="17" fill="#8b5cf6"/>
    <path d="M578 570c71-14 119-39 166-83 23-21 44-33 76-38" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
    <path d="M785 421l66 17-46 51z" fill="#8b5cf6" stroke="#25282d" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
